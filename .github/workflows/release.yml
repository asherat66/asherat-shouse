name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Extract version
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          "version=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Clone dsh main repo
        run: git clone --depth 1 https://github.com/deepseek-ai/deepseek-harness dsh

      - name: Patch dsh llm adapter (General Rules injection)
        run: node scripts/patch-dsh-llm.cjs dsh

      - name: Build dsh CLI
        working-directory: dsh
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Install desktop deps
        run: npm install

      - name: Assemble resources (dsh + node runtime)
        env:
          DSH_SRC: ${{ github.workspace }}\dsh
        run: node scripts/assemble-resources.cjs

      - name: Package app dir (electron-builder dir target)
        run: npx electron-builder --win dir --config electron-builder.yml

      - name: Build dist zip (dedup + link manifest + profile export)
        env:
          DSH_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          node -e "const p=require('./package.json');p.version=process.env.DSH_VERSION;require('fs').writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          node scripts/make-dist.cjs

      - name: Build installer exe
        shell: pwsh
        run: |
          $owner = "${{ github.repository_owner }}"
          $ver = "${{ steps.ver.outputs.version }}"
          $archive = "dsh-desktop.v$ver.win-x64.zip"
          $path = "installer/src/installer.ts"
          $content = Get-Content $path -Raw
          $content = $content -replace 'const DIST_OWNER = "[^"]*";', "const DIST_OWNER = `"$owner`";"
          $content = $content -replace 'const DIST_ARCHIVE = "[^"]*";', "const DIST_ARCHIVE = `"$archive`";"
          Set-Content -Path $path -Value $content -NoNewline
          Set-Location installer
          bun build src/installer.ts --compile --outfile ..\dist\release\dsh-installer.exe

      - name: Stage release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\release | Out-Null
          Copy-Item dist\release\dsh-installer.exe dist\release\dsh-installer.exe -Force
          Get-ChildItem dist\release

      - name: Create GitHub Release & upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: DeepSeek Harness Desktop ${{ steps.ver.outputs.version }}
          body: |
            ## DeepSeek Harness Desktop ${{ steps.ver.outputs.version }}

            ### 安装
            下载 `dsh-installer.exe`,双击运行:自动检测环境 → 下载(带进度条) → 安装 → 启动。
            首次使用在 **设置 → 模型** 填写你的 DeepSeek API Key。

            ### 内含
            - 插件市场 / 文件上传(语音转写) / 费用统计 / 图片输入 / MCP 管理
            - 设置 → 版本更新 / General Rules / prompt copy(jiro.build 嵌入)

            ### 资产
            - `dsh-installer.exe` — 一键安装器
            - `dsh-desktop.v${{ steps.ver.outputs.version }}.win-x64.zip` — 手动解压分发包
          files: |
            dist/release/dsh-installer.exe
            dist/release/dsh-desktop.v*.zip
