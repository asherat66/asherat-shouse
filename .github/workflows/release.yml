name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Extract version
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          "version=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Clone dsh main repo
        run: git clone --depth 1 https://github.com/deepseek-ai/deepseek-harness dsh

      # 注: patch-dsh-llm.cjs 已于 v0.1.7 移除 —— upstream 8/28(0.1.2-alpha.1)起
      # 原生实现 AGENTS.md 注入(agent-instructions), 旧补丁注入 withGlobalRules 会产生
      # ESM duplicate 声明 -> 启动 code=1(v0.1.6 事故根因之一)。
      - name: Build dsh CLI
        working-directory: dsh
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      # v0.1.8: dsh-raw-html 前端渲染补丁(VCP 卡片 HTML 渲染能力)——
      # 必须打在 dsh 源码树 dist(assemble 会复制进绿色包);幂等,锚点不匹配安全中止。
      # bundle 有 hash 文件名,先探测再传(超过一个时取第一个)。
      # 必须用 bash: 默认 pwsh 会展开 $(ls ...) 为其他语义 -> BUNDLE 为空 -> 探测失败。
      # 注意: checkout 落在仓库根(D:\a\asherat-shouse\asherat-shouse), 插件在 plugins/ 无 desktop/ 前缀。
      - name: Patch web bundle (dsh-raw-html VCP renderer)
        shell: bash
        run: |
          {
            echo "PWD: $PWD"
            ls -d dsh dsh/apps/web/dist/assets plugins/dsh-raw-html/patch 2>&1 || true
            BUNDLE=$(ls dsh/apps/web/dist/assets/index-*.js | head -1)
            echo "BUNDLE: [$BUNDLE]"
            if [ -z "$BUNDLE" ]; then
              echo "::error::no bundle found under dsh/apps/web/dist/assets/"
              exit 1
            fi
            node plugins/dsh-raw-html/patch/install-all.cjs "$BUNDLE"
          } 2>&1 | tee patch-diag.log
          exit ${PIPESTATUS[0]}

      - name: Upload patch diag (also on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patch-diag
          path: patch-diag.log
          if-no-files-found: ignore

      - name: Install desktop deps
        run: npm install

      # v0.1.5 修复: 重建 shipped profile(不再依赖作者本机 ~/.dsh)——
      # 4 个自研插件(file:./plugins/*) + npm/tarball 第三方 + AGENTS.md,
      # 用 hoisted 扁平实体布局(零 junction), 产物 .install-src/{profile,AGENTS.md}。
      - name: Build shipped profile (plugins + General Rules)
        run: node scripts/build-shipped-profile.cjs

      - name: Assemble resources (dsh + node runtime)
        env:
          DSH_SRC: ${{ github.workspace }}\dsh
        run: node scripts/assemble-resources.cjs

      - name: Package app dir (electron-builder dir target)
        run: npx electron-builder --win dir --config electron-builder.yml

      - name: Build dist zip (dedup + link manifest + profile export)
        env:
          DSH_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          node -e "const p=require('./package.json');p.version=process.env.DSH_VERSION;require('fs').writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          node scripts/make-dist.cjs --profile-src .install-src

      - name: Build installer exe
        shell: pwsh
        run: |
          $owner = "${{ github.repository_owner }}"
          $ver = "${{ steps.ver.outputs.version }}"
          $archive = "dsh-desktop.v$ver.win-x64.zip"
          $path = "installer/src/installer.ts"
          $content = Get-Content $path -Raw
          $content = $content -replace 'const DIST_OWNER = "[^"]*";', "const DIST_OWNER = `"$owner`";"
          $content = $content -replace 'const DIST_ARCHIVE = "[^"]*";', "const DIST_ARCHIVE = `"$archive`";"
          Set-Content -Path $path -Value $content -NoNewline
          Set-Location installer
          bun build src/installer.ts --compile --outfile ..\dist\release\dsh-installer.exe

      - name: Stage release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\release | Out-Null
          Get-ChildItem dist\release

      - name: Create GitHub Release & upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: DeepSeek Harness Desktop ${{ steps.ver.outputs.version }}
          body: |
            ## DeepSeek Harness Desktop ${{ steps.ver.outputs.version }}

            ### 安装
            下载 `dsh-installer.exe`,双击运行:自动检测环境 → 下载(带进度条) → 安装 → 启动。
            首次使用在 **设置 → 模型** 填写你的 DeepSeek API Key。

            ### 内含
            - 插件市场 / 文件上传(语音转写) / 费用统计 / 图片输入 / MCP 管理
            - 设置 → 版本更新 / General Rules / prompt copy(jiro.build 嵌入)

            ### 资产
            - `dsh-installer.exe` — 一键安装器
            - `dsh-desktop.v${{ steps.ver.outputs.version }}.win-x64.zip` — 手动解压分发包
          files: |
            dist/release/dsh-installer.exe
            dist/release/dsh-desktop.v*.zip
